# Monetta Shopify app — staging (linked).
# client_id is public. Client secret lives only on the backend host as
# SHOPIFY_APP_CLIENT_SECRET — never in this file, Flutter, or git.
#
# Every mutating CLI command MUST use: --config staging
# Linked: 2026-08-16 as "monetta-staging"
#
# Target store for install/tests: monetta-staging.myshopify.com (dev store).
# NEVER install this app on production monetta.mx / fakcei-n9 / monetta-2.

client_id = "4a29ba522a35bd476f3d1f467749234f"
name = "monetta-staging"
# Staging backend. The Fly app is provisioned before this config is released.
application_url = "https://monetta-accounts-staging.fly.dev"
embedded = false
handle = "monetta-staging"

[access_scopes]
scopes = "read_orders,read_customers,read_products,write_products,read_publications,write_publications,read_metaobjects,write_metaobjects"

# App-owned singleton for the native admin control plane. The $app type keeps
# the schema under this app's ownership while allowing the merchant to update
# its one entry through the app.
[metaobjects.app.storefront_config]
name = "Monetta Storefront Configuration"
access.admin = "merchant_read_write"
access.storefront = "public_read"

[metaobjects.app.storefront_config.fields.announcement]
name = "Announcement"
type = "single_line_text_field"

[metaobjects.app.storefront_config.fields.show_hero]
name = "Show hero"
type = "boolean"

[metaobjects.app.storefront_config.fields.show_newest]
name = "Show newest"
type = "boolean"

[metaobjects.app.storefront_config.fields.show_todays_picks]
name = "Show Today's Picks"
type = "boolean"

[metaobjects.app.storefront_config.fields.show_external_picks]
name = "Show external picks"
type = "boolean"

[metaobjects.app.storefront_config.fields.version]
name = "Version"
type = "number_integer"

[auth]
redirect_urls = [
  "https://shopify.dev/apps/default-app-home/api/auth"
]

[webhooks]
# Must match services/accounts_orders routes exactly (see src/api/server.ts).
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = ["orders/create"]
uri = "https://monetta-accounts-staging.fly.dev/webhooks/orders/create"

[[webhooks.subscriptions]]
topics = ["orders/updated"]
uri = "https://monetta-accounts-staging.fly.dev/webhooks/orders/updated"

[[webhooks.subscriptions]]
topics = ["products/create"]
uri = "https://monetta-accounts-staging.fly.dev/webhooks/products/create"

[[webhooks.subscriptions]]
topics = ["products/update"]
uri = "https://monetta-accounts-staging.fly.dev/webhooks/products/update"

# Compliance topics must be separate absolute paths — the server has no
# catch-all /webhooks route. app/uninstalled is intentionally omitted until
# Phase 6 adds a handler (otherwise Shopify would POST to a 404).
[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request"]
uri = "https://monetta-accounts-staging.fly.dev/webhooks/customers/data_request"

[[webhooks.subscriptions]]
compliance_topics = ["customers/redact"]
uri = "https://monetta-accounts-staging.fly.dev/webhooks/customers/redact"

[[webhooks.subscriptions]]
compliance_topics = ["shop/redact"]
uri = "https://monetta-accounts-staging.fly.dev/webhooks/shop/redact"

[build]
automatically_update_urls_on_dev = false
