name: monetta_app
description: Monetta — catálogo de bolsas, carteras y relojes importados originales.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & DI
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing / deep links
  go_router: ^14.6.2

  # Shopify Storefront API (GraphQL)
  ferry: ^0.16.1
  ferry_flutter: ^0.9.1
  gql_http_link: ^1.0.1

  # Local persistence
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2

  # Checkout — see lib/features/cart/README.md for the CheckoutLauncher seam.
  # Pinned deliberately: this is a pre-1.0 plugin on the revenue path.
  checkout_sheet_kit_flutter: ^0.0.2

  # Firebase
  firebase_core: ^3.8.1
  firebase_analytics: ^11.3.6
  firebase_messaging: ^15.1.6
  firebase_remote_config: ^5.1.6

  # UI
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  share_plus: ^10.1.2
  url_launcher: ^6.3.1

  # Models & formatting
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  intl: ^0.19.0
  collection: ^1.19.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  drift_dev: ^2.22.0
  ferry_generator: ^0.13.0
  riverpod_generator: ^2.6.3
  custom_lint: ^0.7.0
  riverpod_lint: ^2.6.3

  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/rules/
    - assets/images/
