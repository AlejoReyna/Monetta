name: monetta_app
description: Monetta — catálogo de bolsas, carteras y relojes importados originales.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management & DI
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0

  # Routing / deep links
  go_router: ^14.6.2

  # Shopify Storefront API (GraphQL over plain HTTP).
  # Deliberately no ferry/codegen — see lib/data/shopify/README.md § 3.
  http: ^1.2.2
  html: ^0.15.6

  # Local persistence
  drift: ^2.22.0
  sqlite3_flutter_libs: ^0.5.26
  path_provider: ^2.1.5
  path: ^1.9.0
  flutter_secure_storage: ^9.2.2

  # Accounts — Customer Account API OAuth 2.0 + PKCE login. AppAuth (via its
  # native iOS/Android SDKs) owns the browser hand-off and PKCE generation
  # end-to-end, so there is deliberately no hand-rolled crypto here — see
  # `lib/data/customer_auth/README.md`.
  flutter_appauth: ^12.0.2

  # Firebase
  firebase_core: ^3.8.1
  cloud_firestore: ^5.6.12
  firebase_analytics: ^11.3.6
  firebase_messaging: ^15.1.6
  firebase_remote_config: ^5.1.6
  # Kept on the FlutterFire generation compatible with firebase_core 3.x.
  firebase_app_check: ^0.3.2+10
  # Device-only cart reminders; remote campaigns still use FCM.
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.0

  # UI
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  video_player: ^2.9.2

  # Models & formatting
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  intl: ^0.20.2 # pinned by flutter_localizations
  collection: ^1.19.0
  uuid: ^4.5.1
  package_info_plus: ^8.1.4
  firebase_crashlytics: ^4.3.10

  crypto: ^3.0.7
  shared_preferences: ^2.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  build_runner: ^2.4.13
  freezed: ^3.2.3
  json_serializable: ^6.9.0
  drift_dev: ^2.22.0
  riverpod_generator: ^4.0.0+1
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0

  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  # Keep iOS plugins on CocoaPods for this mixed plugin set. With Xcode 26,
  # Flutter's generated SwiftPM resources are emitted under Debug-iphoneos
  # while the device runner looks in iphoneos, producing missing .bundle
  # errors for Firebase, GoogleUtilities, share_plus, sqflite, and
  # url_launcher. CocoaPods provides one consistent products directory.
  config:
    enable-swift-package-manager: false
  uses-material-design: true
  generate: true
  assets:
    - assets/rules/
    - assets/images/
    - assets/images/brands/
    - assets/catalog/
    - assets/fonts/inter/OFL.txt
    - assets/fonts/playfair_display/OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Light.ttf
          weight: 300
        - asset: assets/fonts/inter/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
    - family: Playfair Display
      fonts:
        - asset: assets/fonts/playfair_display/PlayfairDisplay-Regular.ttf
          weight: 400
        - asset: assets/fonts/playfair_display/PlayfairDisplay-Bold.ttf
          weight: 700
