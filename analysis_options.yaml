include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Snippets consumed as text by the client-guide content auditor.
    - "tools/style-guideline-content/test/fixtures/**"
    - "docs/style-guideline-migration/content-readiness/reports/archive/**/test/fixtures/**"
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/data/shopify/generated/**"
    # `flutter build ios` vendors the whole FlutterFire repo — its own tests
    # included — into build/ios/SourcePackages. That is third-party source
    # which does not resolve against this app's pubspec, and it buries
    # `flutter analyze` under ~12k errors belonging to nobody.
    - "build/**"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    invalid_annotation_target: ignore

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - unawaited_futures
    - use_super_parameters
    - sort_pub_dependencies: false
